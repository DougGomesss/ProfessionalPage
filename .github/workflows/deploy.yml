name: Deploy to GitHub Pages

on:
  push:
    branches:
      - landingPageGit

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build:gh-pages

      - name: Copy index.html to 404.html
        run: cp dist/portifolio-dev/browser/index.html dist/portifolio-dev/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/portifolio-dev/browser
          branch: gh-pages
          clean: true
