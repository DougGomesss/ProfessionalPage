@let modalContent = translation().modal;

<div class="modal-backdrop" (click)="closeModal()">
  <div
    class="modal-content"
    id="project-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'project-modal-title-' + project.id"
    (click)="$event.stopPropagation()"
  >
    <button
      #closeButton
      class="close-btn"
      type="button"
      [attr.aria-label]="modalContent.closeAriaLabel"
      (click)="closeModal()"
    >
      &times;
    </button>
    <h2 [id]="'project-modal-title-' + project.id">{{ project.title }}</h2>
    <div class="tech-tags">
      @for (tech of project.technologies; track tech) {
        <span class="tag">{{ tech }}</span>
      }
    </div>
    <div class="modal-body">
      @if (project.imageUrl || project.imageUrl2) {
        <div class="modal-media-grid">
          @if (project.imageUrl) {
            <img [src]="getImageUrl(project.imageUrl)" [alt]="getImageAlt(1)" class="modal-img" />
          }
          @if (project.imageUrl2) {
            <img [src]="getImageUrl(project.imageUrl2)" [alt]="getImageAlt(2)" class="modal-img" />
          }
        </div>
      }
      @if (project.video) {
        <video
          #videoPlayer
          class="modal-video"
          width="100%"
          autoplay
          loop
          muted
          playsinline
          [attr.poster]="project.imageUrl ? getImageUrl(project.imageUrl) : null"
        >
          <source [src]="project.video" type="video/mp4" />
          {{ modalContent.browserNoVideo }}
        </video>
      }
      <p class="specs">{{ project.detailedSpecs }}</p>
    </div>
  </div>
</div>
