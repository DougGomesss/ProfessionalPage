@let content = translation();

    <p class="landing-role">{{ content.hero.subtitle }}</p>
    <nav class="landing-nav" aria-label="Seções">
      <a routerLink="/sobre" class="nav-item">
        <span class="nav-label">{{ content.nav.sobre }}</span>
        <span class="nav-fill" aria-hidden="true"></span>

      <a routerLink="/trabalhos" class="nav-item">
        <span class="nav-label">{{ content.nav.trabalhos }}</span>
        <span class="nav-fill" aria-hidden="true"></span>
        <span class="nav-num">II</span>

    </nav>
